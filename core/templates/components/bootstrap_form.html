<div class="row">

    {% for field in form %}

        <div class="col-4 form-group mb-3">

            {{ field.label_tag }}

            {{ field }}

            {% if field.help_text %}
                <small class="form-text text-muted">
                    {{ field.help_text }}
                </small>
            {% endif %}

            {% if field.errors %}
                {% for error in field.errors %}
                    <div class="text-danger small mt-1">
                        {{ error }}
                    </div>
                {% endfor %}
            {% endif %}

        </div>

    {% endfor %}

</div>
