{% extends "base.html" %}
{% block title %}Login{% endblock%}
{% block content%}
<div class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-4 mb-5">
                <div class="card">
                    <div class="card-body">
                        <form id="registrationForm" method="post" action="" class="d-flex flex-column gap-3" dir="rtl">
                            {% csrf_token %}
                            <div class="form-group">
                                <label for="personnel-code" class="mb-1">
                                    کد پرسنلی
                                </label>
                                <input name="personnel_code" class="form-control" id="personnel-code" placeholder="کد پرسنلی را وارد کنید ..." required />
                            </div>
                            <div class="form-group">
                                <label for="password" class="mb-1">
                                    رمز عبور
                                </label>
                                <input name="password" type="password" class="form-control" id="password" placeholder="رمز عبور را وارد کنید ..." required />
                            </div>
                            <button type="submit" class="btn btn-info center">
                                ورود
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
